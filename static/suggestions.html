    <header class="appbar" id="appbar">
        <div class="container appbar__inner">
            <a class="brand" href="index.html" aria-label="Content Manager">
                <svg class="icon icon--lg" aria-hidden="true" focusable="false"><use href="#i-box"/></svg><span>Content Manager</span>
            </a>
            <nav class="nav" aria-label="Pages">
                <a class="tab" href="index.html" data-nav="files">Files</a>
                <a class="tab" href="suggestions.html" data-nav="suggestions" aria-current="page">Suggestions
                    <span class="chip" id="pending-chip" aria-hidden="true">0</span><span class="visually-hidden" id="pending-sr"></span>
                </a>
            </nav>
            <div class="appbar__actions">
                <button type="button" class="btn btn--icon" id="refresh-btn" aria-label="Refresh"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-refresh"/></svg></button>
                <button type="button" class="btn btn--icon btn--ghost" id="help-btn" aria-label="Keyboard shortcuts"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-help"/></svg></button>
            </div>
        </div>
    </header>

    <div class="siterow">
        <div class="container siterow__inner">
            <nav class="siterail" id="site-switcher" aria-label="Sites"></nav>
            <div class="siterow__end">
                <a class="btn btn--sm btn--ghost" id="pending-link" href="index.html?prefix=_suggestions%2F_pending%2F"
                    title="Media uploaded through the public API, grouped by whether a suggestion references it">
                    <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-inbox"/></svg><span>Pending uploads</span>
                </a>
            </div>
        </div>
    </div>

    <main class="container" id="main">
        <h1 class="visually-hidden">Content Manager — Suggestions</h1>
        <div class="statusrow" id="statusrow" role="group" aria-label="Status filter"></div>
        <div id="cards" class="cards"></div>
        <div id="content-empty" class="empty" role="status" hidden></div>
        <div id="content-error" class="notice notice--danger" hidden></div>
    </main>

    <dialog id="preview" class="dialog--wide" aria-labelledby="preview-title">
        <div class="dialog__head">
            <h2 class="dialog__title mono" id="preview-title"></h2>
            <span class="muted num" id="preview-pos"></span>
            <button type="button" class="btn btn--icon btn--ghost" data-close aria-label="Close"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-x"/></svg></button>
        </div>
        <div class="dialog__body">
            <div class="preview__media" id="preview-media"></div>
            <dl class="kv preview__meta" id="preview-meta"></dl>
        </div>
        <div class="dialog__actions" id="preview-actions"></div>
    </dialog>

    <script type="module" src="js/suggestions.js"></script>
</body>

</html>
